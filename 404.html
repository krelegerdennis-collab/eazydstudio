<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lost in space — EazyD Studio</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1e4a" />
    <link rel="icon" href="/favicon-v2.ico" sizes="any" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .lost { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 2rem; gap: 1rem; }
      .lost img { width: 160px; margin: 0 auto; filter: drop-shadow(0 0 18px rgba(255,140,26,.45)); }
      .lost h1 { font-family: var(--font-head); color: var(--orange); font-size: clamp(1.5rem, 6vw, 2.5rem); margin: 0; }
      .lost p { color: var(--text-muted); margin: 0 auto 1rem; max-width: 36ch; }
    </style>
  </head>
  <body>
    <div class="starfield" aria-hidden="true"></div>
    <main class="lost">
      <img src="/img/logo-holo-280.webp" alt="EazyD Studio logo" width="280" height="280" />
      <h1>404</h1>
      <p>This page drifted out of orbit. Let's get you back to base.</p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="/">Back to EazyD Studio</a>
        <a class="btn btn--secondary" href="https://eazydstudio.itch.io" target="_blank" rel="noopener noreferrer">Browse on itch.io</a>
      </div>
    </main>
  </body>
</html>
