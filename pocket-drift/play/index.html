<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050f2a">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://eazydstudio.com/pocket-drift/">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="index.icon.png">
<title>Pocket Drift</title>
<style>
:root { --bg: #050f2a; --fg: #f2f5fb; --muted: #c3cde3; --accent: #ff8c1a; --track: #0a1e4a; color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Trebuchet MS", system-ui, sans-serif; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); text-align: center; padding: 16px; }
#status h1 { margin: 0; font-size: clamp(30px, 9vw, 54px); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
#status p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.5; }
.bar { width: min(320px, 80vw); height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
<div id="status">
  <h1>Pocket Drift</h1>
  <div class="bar"><div id="fill"></div></div>
  <p id="msg">Loading… (about 11 MB)</p>
  <p id="turn" style="display:none">Tip: turn your phone sideways.</p>
</div>
<script>
// De engine staat gzip-gecomprimeerd op de server (limiet per bestand); hier wordt hij uitgepakt.
(function () {
  const realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    if (/index\.wasm(\?|$)/.test(url)) {
      return realFetch(url.replace('index.wasm', 'engine-gz.wasm'), init).then((res) => {
        if (!res.ok) throw new Error('Could not load the game (' + res.status + ')');
        const body = res.body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(body, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
      });
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="index.js?v=20261109210125"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2309296,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const engine = new Engine(GODOT_CONFIG);
const statusEl = document.getElementById('status');
const fill = document.getElementById('fill');
const msg = document.getElementById('msg');
if (window.matchMedia('(pointer: coarse) and (orientation: portrait)').matches) document.getElementById('turn').style.display = '';
const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
  msg.textContent = 'This browser is missing: ' + missing.join(', ') + '. Try Chrome.';
} else {
  engine.startGame({
    onProgress: (cur, total) => { if (total > 0) fill.style.width = Math.round(cur / total * 100) + '%'; },
  }).then(() => { statusEl.remove(); document.title = 'Pocket Drift'; })
    .catch((err) => { console.error(err); msg.textContent = 'Could not start: ' + (err && err.message ? err.message : err); });
}
</script>
</body>
</html>
