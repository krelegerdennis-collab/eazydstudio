<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050f2a">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://eazydstudio.com/pocket-drift/">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="index.icon.png">
<title>Pocket Drift</title>
<style>
:root { --bg: #050f2a; --fg: #f2f5fb; --muted: #c3cde3; --accent: #ff8c1a; --track: #0a1e4a; color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Trebuchet MS", system-ui, sans-serif; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); text-align: center; padding: 16px; }
#status h1 { margin: 0; font-size: clamp(30px, 9vw, 54px); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
#status p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.5; }
.bar { width: min(320px, 80vw); height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#fs { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: none; padding: 8px 16px; border-radius: 999px;
  border: 2px solid rgba(62,230,255,.6); background: rgba(10,30,74,.6); color: var(--fg); font: 600 14px system-ui, sans-serif; z-index: 5; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
<button id="fs" type="button">⛶ Full screen</button>
<div id="status">
  <h1>Pocket Drift</h1>
  <div class="bar"><div id="fill"></div></div>
  <p id="msg">Loading… (about 11 MB)</p>
  <p id="turn" style="display:none">Tip: turn your phone sideways.</p>
</div>
<script>
// De engine staat gzip-gecomprimeerd op de server (limiet per bestand); hier wordt hij uitgepakt.
(function () {
  const realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    if (/index\.wasm(\?|$)/.test(url)) {
      return realFetch(url.replace('index.wasm', 'engine-gz.wasm'), init).then((res) => {
        if (!res.ok) throw new Error('Could not load the game (' + res.status + ')');
        const body = res.body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(body, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
      });
    }
    return realFetch(input, init);
  };
})();
</script>
<script>
// Volledig scherm op telefoons (geen menu-balk van de browser) en op Android meteen liggend.
(function () {
  const fs = document.getElementById('fs');
  const touch = matchMedia('(pointer: coarse)').matches;
  const can = document.fullscreenEnabled;
  const sync = () => { fs.style.display = touch && can && !document.fullscreenElement ? 'block' : 'none'; };
  fs.addEventListener('click', () => {
    document.documentElement.requestFullscreen({ navigationUI: 'hide' })
      .then(() => screen.orientation && screen.orientation.lock ? screen.orientation.lock('landscape').catch(() => {}) : null)
      .catch(() => {});
  });
  document.addEventListener('fullscreenchange', sync);
  sync();
})();
</script>
<script>
// Kantelsturing: window.pdTilt.steer = -1 (links) .. 1 (rechts), uit de zwaartekracht in schermrichting.
// Het spel leest dit alleen als STUREN: KANTELEN aan staat. Android en iOS geven tegengestelde tekens.
window.pdTilt = { steer: 0, ok: false };
(function () {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const FULL = 4.0;      // m/s2 zijwaarts = vol sturen (ongeveer 25 graden kantelen)
  const DEAD = 0.6;      // rustig vasthouden stuurt niet
  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    let gx = g.x, gy = g.y;
    if (ios) { gx = -gx; gy = -gy; }
    const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    // zwaartekracht langs de schermbreedte (rechts = +)
    let sx = gx;
    if (angle === 90) sx = -gy; else if (angle === -90 || angle === 270) sx = gy; else if (angle === 180) sx = -gx;
    let v = -sx;
    v = Math.abs(v) < DEAD ? 0 : (v - Math.sign(v) * DEAD) / (FULL - DEAD);
    window.pdTilt.steer = Math.max(-1, Math.min(1, v));
    window.pdTilt.ok = true;
  }
  // Altijd luisteren. iOS stuurt pas gegevens na toestemming, en die mag alleen na een tik gevraagd worden.
  window.addEventListener('devicemotion', onMotion);
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    window.addEventListener('touchend', function ask() {
      DeviceMotionEvent.requestPermission().catch(() => {});
      window.removeEventListener('touchend', ask);
    });
  }
})();
</script>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2485920,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const engine = new Engine(GODOT_CONFIG);
const statusEl = document.getElementById('status');
const fill = document.getElementById('fill');
const msg = document.getElementById('msg');
if (window.matchMedia('(pointer: coarse) and (orientation: portrait)').matches) document.getElementById('turn').style.display = '';
const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
  msg.textContent = 'This browser is missing: ' + missing.join(', ') + '. Try Chrome.';
} else {
  engine.startGame({
    onProgress: (cur, total) => { if (total > 0) fill.style.width = Math.round(cur / total * 100) + '%'; },
  }).then(() => { statusEl.remove(); document.title = 'Pocket Drift'; })
    .catch((err) => { console.error(err); msg.textContent = 'Could not start: ' + (err && err.message ? err.message : err); });
}
</script>
</body>
</html>
