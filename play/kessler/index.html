<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KESSLER slice</title>
<style>
html,body{margin:0;height:100%;background:#0c1018;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#unity-canvas{width:100vw;height:100vh;display:block;background:#0c1018}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#5ed3e6;font:600 16px system-ui,sans-serif;letter-spacing:.1em}
#bar{width:220px;height:4px;background:#243043}#fill{height:100%;width:0;background:#5ed3e6}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="load"><div>KESSLER</div><div id="bar"><div id="fill"></div></div><div id="msg">laden</div></div>
<script src="Build/web.loader.js"></script>
<script>
var canvas=document.querySelector("#unity-canvas");
function fit(){var r=window.devicePixelRatio||1;canvas.width=Math.floor(innerWidth*Math.min(r,2));canvas.height=Math.floor(innerHeight*Math.min(r,2));}
fit();addEventListener("resize",fit);
createUnityInstance(canvas,{
  dataUrl:"Build/web.data",frameworkUrl:"Build/web.framework.js",codeUrl:"Build/web.wasm",
  streamingAssetsUrl:"StreamingAssets",companyName:"Dennis Kreleger",productName:"KESSLER slice",productVersion:"1.0",
  matchWebGLToCanvasSize:false,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)
},function(p){document.getElementById("fill").style.width=Math.round(p*100)+"%";}).then(function(){document.getElementById("load").remove();})
.catch(function(e){document.getElementById("msg").textContent="fout: "+e;});
</script>
</body>
</html>
